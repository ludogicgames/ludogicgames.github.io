<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ludogic — Lleva tu web al siguiente nivel</title>
  <meta name="description" content="Ludogic diseña y desarrolla webs, campus virtuales, e-commerce y videojuegos con el mismo rigor técnico. Rediseño web, campus virtuales, e-commerce, videojuegos web y diseño digital.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,600;6..96,700&family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Partículas ambientales (turquesa/blanco) de fondo para toda la web -->
  <canvas id="ambient-particles" aria-hidden="true"></canvas>

  <header class="site-header">
    <div class="nav-wrap">
      <a class="logo" href="#inicio">
        <span class="logo-mark" aria-hidden="true"></span>
        <span data-site-name>Ludogic</span>
      </a>
      <button class="nav-toggle" id="nav-toggle" aria-label="Abrir menú" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <nav class="main-nav" id="main-nav">
        <ul id="nav-links"></ul>
      </nav>
    </div>
  </header>

  <main>

    <!-- ================= HERO: puerta 3D que se abre con el scroll ================= -->
    <section id="inicio" class="hero">
      <div class="hero-scroll" id="hero-scroll">
        <div class="hero-sticky" id="hero-sticky">
          <canvas id="hero-3d" aria-hidden="true"></canvas>
          <div class="hero-inner" id="hero-inner">
            <div class="hero-panel">
              <p class="kicker" id="hero-kicker"></p>
              <h1 id="hero-title"></h1>
              <p class="hero-text" id="hero-text"></p>
              <div class="hero-actions">
                <a class="btn btn-primary" id="hero-cta-primary" href="#plantas"></a>
                <a class="btn btn-outline" id="hero-cta-secondary" href="#plantas"></a>
              </div>
              <p class="scroll-hint">Desliza para entrar ↓</p>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- ================= SERVICIOS: plantas del edificio, descenso en 2.5D ================= -->
    <section id="plantas" class="floors fade-in">
      <div class="section-head">
        <p class="kicker kicker-center" id="floors-kicker"></p>
        <h2 id="floors-title"></h2>
        <p class="section-intro" id="floors-intro"></p>
      </div>

      <!-- Edificio en 3D real (Three.js): un dron desciende pegado a la
           fachada de cristal, mirando siempre de frente al fondo de cada
           sala (nunca en picado). A la izquierda, un ascensor en CSS baja
           en sincronía con el scroll y marca en qué planta estás; a la
           derecha, la vista 3D del edificio. En móvil solo se ve el
           edificio (el ascensor se oculta). -->
      <div class="building-scroll" id="building-scroll">
        <div class="building-sticky" id="building-sticky">

          <div class="building-elevator" id="building-elevator" aria-hidden="true">
            <div class="elevator-shaft">
              <div class="elevator-rail elevator-rail-left"></div>
              <div class="elevator-rail elevator-rail-right"></div>
              <!-- Generado por render.js a partir de data.js (FLOORS) -->
              <div class="elevator-marks" id="elevator-marks"></div>
              <div class="elevator-car" id="elevator-car">
                <span class="elevator-car-code" id="elevator-car-code">01</span>
              </div>
            </div>
          </div>

          <div class="building-view" id="building-view">
            <canvas id="building-3d" aria-hidden="true"></canvas>
            <div class="building-readout" id="building-readout">01</div>

            <!-- Generado por render.js a partir de data.js (FLOORS) -->
            <div class="floor-panels" id="floor-panels"></div>
          </div>

          <p class="scroll-hint building-hint">Sigue bajando ↓</p>
        </div>
      </div>
    </section>

    <!-- ================= PORTFOLIO ================= -->
    <section id="portfolio" class="portfolio fade-in">
      <div class="section-head">
        <p class="kicker kicker-center" id="portfolio-kicker"></p>
        <h2 id="portfolio-title"></h2>
        <p class="section-intro" id="portfolio-intro"></p>
      </div>

      <!-- Generado por render.js a partir de data.js (PORTFOLIO) -->
      <div class="portfolio-list" id="portfolio-list"></div>
    </section>

    <!-- ================= CONTACTO ================= -->
    <section id="contacto" class="contact fade-in">
      <p class="kicker kicker-center" id="contact-kicker"></p>
      <h2 id="contact-title"></h2>
      <p class="section-intro" id="contact-text"></p>
      <a class="btn btn-primary" id="contact-email" href="#"></a>
    </section>

  </main>

  <footer class="site-footer">
    <p id="footer-text"></p>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" defer></script>
  <script src="data.js" defer></script>
  <script src="render.js" defer></script>
  <script src="hero3d.js" defer></script>
  <script src="building3d.js" defer></script>
  <script src="ambient-particles.js" defer></script>
  <script src="script.js" defer></script>
</body>
</html>
