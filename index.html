<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-6NTZG4TBGY"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-6NTZG4TBGY');
  </script>

  <title>Ludogic — Gamification and custom web games</title>
  <meta name="description" content="We design and build gamification for training, marketing and product, plus custom web games. Experiences people actually finish and actually use.">
  <link rel="canonical" href="https://ludogic.dev/">
  <link rel="alternate" hreflang="en" href="https://ludogic.dev/">
  <link rel="alternate" hreflang="es" href="https://ludogic.dev/es/">
  <link rel="alternate" hreflang="x-default" href="https://ludogic.dev/">
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>

  <!-- Partículas ambientales (turquesa/blanco) de fondo para toda la web -->
  <canvas id="ambient-particles" aria-hidden="true"></canvas>

  <header class="site-header">
    <div class="nav-wrap">
      <a class="logo" href="#inicio">
        <img class="logo-img" src="/images/logo-ludogic-white.png" alt="Ludogic">
      </a>
      <button class="nav-toggle" id="nav-toggle" aria-label="Open menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <nav class="main-nav" id="main-nav">
        <ul id="nav-links"></ul>
      </nav>
      <!-- Selector de idioma: los dos botones siempre visibles (enlace
           estático al mismo sitio en el otro idioma; el activo no es un
           enlace, solo una etiqueta). -->
      <div class="lang-switch" role="group" aria-label="Language">
        <span class="lang-switch-option is-active" aria-current="true">EN</span>
        <a class="lang-switch-option" href="/es/">ES</a>
      </div>
    </div>
  </header>

  <main>

    <!-- ================= HERO: puerta 3D que se abre con el scroll ================= -->
    <section id="inicio" class="hero">
      <div class="hero-scroll" id="hero-scroll">
        <div class="hero-sticky" id="hero-sticky">
          <canvas id="hero-3d" aria-hidden="true"></canvas>
          <div class="hero-inner" id="hero-inner">
            <div class="hero-panel">
              <p class="kicker" id="hero-kicker"></p>
              <h1 id="hero-title"></h1>
              <p class="hero-text" id="hero-text"></p>
              <div class="hero-actions">
                <!-- Baja la página sola (rápido al principio, normal a partir
                     del ascensor) para ver toda la web sin tocar el ratón (ver
                     tour.js). Botón, no enlace: no navega, cambia de estado
                     (empezar/detener el recorrido). -->
                <button type="button" class="btn btn-primary" id="hero-cta-tour"></button>
              </div>
              <p class="scroll-hint" id="hero-scroll-hint">Scroll to enter ↓</p>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- ================= SERVICIOS: plantas del edificio, descenso en 2.5D ================= -->
    <section id="plantas" class="floors fade-in">
      <div class="section-head">
        <p class="kicker kicker-center" id="floors-kicker"></p>
        <h2 id="floors-title"></h2>
        <p class="section-intro" id="floors-intro"></p>
      </div>

      <!-- Edificio en 3D real (Three.js): un dron desciende pegado a la
           fachada de cristal, mirando siempre de frente al fondo de cada
           sala (nunca en picado). El ascensor es un objeto 3D más de la
           escena, integrado en el propio edificio, que baja junto a la
           cámara. Al llegar a la última planta el descenso simplemente
           termina; el scroll normal continúa hacia el formulario de
           contacto (sección aparte, más abajo). -->
      <div class="building-scroll" id="building-scroll">
        <div class="building-sticky" id="building-sticky">
          <canvas id="building-3d" aria-hidden="true"></canvas>

          <!-- Generado por render.js a partir de data.js (FLOORS) -->
          <div class="floor-panels" id="floor-panels"></div>

          <p class="scroll-hint building-hint" id="building-hint">Keep scrolling ↓</p>
        </div>
      </div>
    </section>

    <!-- ================= PORTFOLIO ================= -->
    <section id="portfolio" class="portfolio fade-in">
      <div class="section-head">
        <p class="kicker kicker-center" id="portfolio-kicker"></p>
        <h2 id="portfolio-title"></h2>
        <p class="section-intro" id="portfolio-intro"></p>
      </div>

      <!-- Generado por render.js a partir de data.js (PORTFOLIO) -->
      <div class="portfolio-list" id="portfolio-list"></div>
    </section>

    <!-- ================= CONTACTO ================= -->
    <!-- Sección normal a pantalla completa: nada de scroll-jacking, solo
         se llega a ella siguiendo el scroll hacia abajo. -->
    <section id="contacto" class="contact-section fade-in">
      <div class="contact-panel">
        <p class="kicker kicker-center" id="contact-kicker"></p>
        <h2 id="contact-title"></h2>
        <p class="section-intro" id="contact-text"></p>

        <!-- Envía de verdad a través de Web3Forms, sin backend propio
             (ver data.js:CONTACT.web3formsAccessKey y script.js). -->
        <form class="contact-form" id="contact-form" novalidate>
          <input type="hidden" name="access_key" id="contact-access-key">
          <input type="hidden" name="subject" id="contact-subject" value="New message from ludogic.dev">
          <!-- Trampa anti-spam de Web3Forms: invisible para personas, los
               bots suelen rellenarla. -->
          <input type="checkbox" name="botcheck" class="botcheck-field" tabindex="-1" autocomplete="off">

          <div class="form-field">
            <label for="contact-name" id="contact-name-label"></label>
            <input type="text" id="contact-name" name="name" autocomplete="name" required>
          </div>
          <div class="form-field">
            <label for="contact-email-field" id="contact-email-label"></label>
            <input type="email" id="contact-email-field" name="email" autocomplete="email" required>
          </div>
          <div class="form-field">
            <label for="contact-message" id="contact-message-label"></label>
            <textarea id="contact-message" name="message" rows="5" required></textarea>
          </div>
          <button type="submit" class="btn btn-primary" id="contact-submit"></button>
          <p class="contact-form-status" id="contact-form-status" role="status" aria-live="polite"></p>
          <p class="contact-form-note" id="contact-form-note"></p>
        </form>
      </div>
    </section>

  </main>

  <footer class="site-footer">
    <p id="footer-text"></p>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" defer></script>
  <script src="/data.en.js" defer></script>
  <script src="/render.js" defer></script>
  <script src="/hero3d.js" defer></script>
  <script src="/building3d.js" defer></script>
  <script src="/ambient-particles.js" defer></script>
  <script src="/tour.js" defer></script>
  <script src="/script.js" defer></script>
</body>
</html>
