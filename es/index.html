<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Evita que Chrome ofrezca traducir esta página automáticamente: ya es
       la versión en español hecha a mano. -->
  <meta name="google" content="notranslate">

  <!-- Google Analytics ya NO se carga aquí incondicionalmente: se activa
       desde cookie-consent.js solo si el visitante acepta el banner de
       cookies (ver el final del body). -->

  <title>Ludogic — Gamificación y videojuegos web a medida</title>
  <meta name="description" content="Diseñamos y desarrollamos gamificación para formación, marketing y producto, además de videojuegos web a medida. Experiencias que la gente sí termina y sí usa.">
  <link rel="canonical" href="https://ludogic.dev/es/">
  <link rel="alternate" hreflang="en" href="https://ludogic.dev/">
  <link rel="alternate" hreflang="es" href="https://ludogic.dev/es/">
  <link rel="alternate" hreflang="x-default" href="https://ludogic.dev/">

  <!-- Open Graph / Twitter Card: cómo se ve el link al compartirlo
       (LinkedIn, email, WhatsApp...). og-image-es.png es 1200x630. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Ludogic">
  <meta property="og:url" content="https://ludogic.dev/es/">
  <meta property="og:title" content="Ludogic — Gamificación y videojuegos web a medida">
  <meta property="og:description" content="Diseñamos y desarrollamos gamificación para formación, marketing y producto, además de videojuegos web a medida. Experiencias que la gente sí termina y sí usa.">
  <meta property="og:image" content="https://ludogic.dev/images/og-image-es.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="es_ES">
  <meta property="og:locale:alternate" content="en_US">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Ludogic — Gamificación y videojuegos web a medida">
  <meta name="twitter:description" content="Diseñamos y desarrollamos gamificación para formación, marketing y producto, además de videojuegos web a medida. Experiencias que la gente sí termina y sí usa.">
  <meta name="twitter:image" content="https://ludogic.dev/images/og-image-es.png">

  <!-- Datos estructurados (JSON-LD): le dice a Google explícitamente
       quién es Ludogic como organización, en vez de que lo infiera del
       texto de la página. -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "Ludogic",
    "url": "https://ludogic.dev/",
    "logo": "https://ludogic.dev/images/logo-ludogic.png",
    "description": "Diseñamos y desarrollamos gamificación para formación, marketing y producto, además de videojuegos web a medida.",
    "email": "hello@ludogic.dev"
  }
  </script>

  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/fonts/fonts.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>

  <!-- Partículas ambientales (turquesa/blanco) de fondo para toda la web -->
  <canvas id="ambient-particles" aria-hidden="true"></canvas>

  <header class="site-header">
    <div class="nav-wrap">
      <a class="logo" href="#inicio">
        <img class="logo-img" src="/images/logo-ludogic-white.png" alt="Ludogic">
      </a>
      <button class="nav-toggle" id="nav-toggle" aria-label="Abrir menú" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <nav class="main-nav" id="main-nav">
        <ul id="nav-links"></ul>
      </nav>
      <!-- Selector de idioma: los dos botones siempre visibles (enlace
           estático al mismo sitio en el otro idioma; el activo no es un
           enlace, solo una etiqueta). -->
      <div class="lang-switch" role="group" aria-label="Idioma">
        <a class="lang-switch-option" href="/">EN</a>
        <span class="lang-switch-option is-active" aria-current="true">ES</span>
      </div>
    </div>
  </header>

  <main>

    <!-- ================= HERO: puerta 3D que se abre con el scroll ================= -->
    <section id="inicio" class="hero">
      <div class="hero-scroll" id="hero-scroll">
        <div class="hero-sticky" id="hero-sticky">
          <canvas id="hero-3d" aria-hidden="true"></canvas>
          <div class="hero-inner" id="hero-inner">
            <div class="hero-panel">
              <p class="kicker" id="hero-kicker"></p>
              <h1 id="hero-title"></h1>
              <p class="hero-text" id="hero-text"></p>
              <p class="scroll-hint" id="hero-scroll-hint">Desliza para entrar ↓</p>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- ================= SERVICIOS: plantas del edificio, descenso en 2.5D ================= -->
    <section id="plantas" class="floors fade-in">
      <!-- Sin cabecera de kicker/título/intro: las 4 tarjetas de servicio
           hablan por sí solas, la cabecera genérica no aportaba nada. -->

      <!-- Edificio en 3D real (Three.js): un dron desciende pegado a la
           fachada de cristal, mirando siempre de frente al fondo de cada
           sala (nunca en picado). El ascensor es un objeto 3D más de la
           escena, integrado en el propio edificio, que baja junto a la
           cámara. Al llegar a la última planta el descenso simplemente
           termina; el scroll normal continúa hacia el formulario de
           contacto (sección aparte, más abajo). -->
      <div class="building-scroll" id="building-scroll">
        <div class="building-sticky" id="building-sticky">
          <canvas id="building-3d" aria-hidden="true"></canvas>

          <!-- Generado por render.js a partir de data.js (FLOORS) -->
          <div class="floor-panels" id="floor-panels"></div>

          <p class="scroll-hint building-hint" id="building-hint">Sigue bajando ↓</p>
        </div>
      </div>
    </section>

    <!-- ================= METODOLOGÍA: diagrama circular, 5 pasos en sentido
         horario + garantía en el centro. Generado por render.js a partir de
         data.js (METHODOLOGY / METHODOLOGY_GUARANTEE). ================= -->
    <section id="metodologia" class="methodology fade-in">
      <div class="section-head">
        <p class="kicker kicker-center" id="methodology-kicker"></p>
        <h2 id="methodology-title"></h2>
      </div>

      <div class="methodology-clock" id="methodology-clock">
        <!-- Flechas 1→2→3→4→5→6 en sentido horario (en las horas del
             reloj: 12, 2, 4, 6, 8, 10); sin cerrar el círculo (no hay
             flecha de 6 a 1) -->
        <svg class="methodology-arrows" viewBox="0 0 560 560" aria-hidden="true">
          <defs>
            <marker id="methodology-arrowhead" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
              <path d="M0,0 L10,5 L0,10 z" fill="currentColor"></path>
            </marker>
          </defs>
          <path d="M 280 5 A 275 275 0 0 1 518.15 142.5" marker-end="url(#methodology-arrowhead)"></path>
          <path d="M 518.15 142.5 A 275 275 0 0 1 518.15 417.5" marker-end="url(#methodology-arrowhead)"></path>
          <path d="M 518.15 417.5 A 275 275 0 0 1 280 555" marker-end="url(#methodology-arrowhead)"></path>
          <path d="M 280 555 A 275 275 0 0 1 41.85 417.5" marker-end="url(#methodology-arrowhead)"></path>
          <path d="M 41.85 417.5 A 275 275 0 0 1 41.85 142.5" marker-end="url(#methodology-arrowhead)"></path>
        </svg>
        <div class="methodology-guarantee" id="methodology-guarantee"></div>
      </div>
    </section>

    <!-- ================= PORTFOLIO ================= -->
    <section id="portfolio" class="portfolio fade-in">
      <div class="section-head">
        <p class="kicker kicker-center" id="portfolio-kicker"></p>
        <h2 id="portfolio-title"></h2>
        <p class="section-intro" id="portfolio-intro"></p>
      </div>

      <!-- Generado por render.js a partir de data.js (PORTFOLIO) -->
      <div class="portfolio-list" id="portfolio-list"></div>
    </section>

    <!-- ================= CONTACTO ================= -->
    <!-- Sección normal a pantalla completa: nada de scroll-jacking, solo
         se llega a ella siguiendo el scroll hacia abajo. -->
    <section id="contacto" class="contact-section fade-in">
      <div class="contact-panel">
        <p class="kicker kicker-center" id="contact-kicker"></p>
        <h2 id="contact-title"></h2>
        <p class="section-intro" id="contact-text"></p>

        <!-- Envía de verdad a través de Web3Forms, sin backend propio
             (ver data.js:CONTACT.web3formsAccessKey y script.js). -->
        <form class="contact-form" id="contact-form" novalidate>
          <input type="hidden" name="access_key" id="contact-access-key">
          <input type="hidden" name="subject" id="contact-subject" value="Nuevo mensaje desde ludogic.dev">
          <!-- Trampa anti-spam de Web3Forms: invisible para personas, los
               bots suelen rellenarla. -->
          <input type="checkbox" name="botcheck" class="botcheck-field" tabindex="-1" autocomplete="off">

          <div class="form-field">
            <label for="contact-name" id="contact-name-label"></label>
            <input type="text" id="contact-name" name="name" autocomplete="name" required>
          </div>
          <div class="form-field">
            <label for="contact-company" id="contact-company-label"></label>
            <input type="text" id="contact-company" name="company" autocomplete="organization">
          </div>
          <div class="form-field">
            <label for="contact-email-field" id="contact-email-label"></label>
            <input type="email" id="contact-email-field" name="email" autocomplete="email" required>
          </div>
          <div class="form-field">
            <label for="contact-message" id="contact-message-label"></label>
            <textarea id="contact-message" name="message" rows="5" required></textarea>
          </div>
          <div class="form-field form-field-consent">
            <input type="checkbox" id="contact-consent" name="consent" required>
            <label for="contact-consent">He leído y acepto la <a href="/es/politica-de-privacidad.html" target="_blank" rel="noopener">Política de Privacidad</a>.</label>
          </div>
          <button type="submit" class="btn btn-primary" id="contact-submit"></button>
          <p class="contact-form-status" id="contact-form-status" role="status" aria-live="polite"></p>
          <p class="contact-form-note" id="contact-form-note"></p>
        </form>
      </div>
    </section>

  </main>

  <footer class="site-footer">
    <nav class="footer-social" aria-label="Sigue a Ludogic">
      <a href="https://www.instagram.com/ludogic.dev/" target="_blank" rel="noopener noreferrer" aria-label="Ludogic en Instagram"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.3" cy="6.7" r="1" class="fill"/></svg></a>
      <a href="https://www.facebook.com/profile.php?id=1327299947125173" target="_blank" rel="noopener noreferrer" aria-label="Ludogic en Facebook"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 21v-7.5h2.6l.4-3h-3V8.6c0-.9.3-1.5 1.6-1.5h1.5V4.4c-.3 0-1.2-.1-2.2-.1-2.2 0-3.7 1.3-3.7 3.8v2.4H9.2v3h2.5V21" class="fill"/></svg></a>
      <a href="https://www.youtube.com/channel/UC2rgkKKnnX-8YS_fBb2lr_A" target="_blank" rel="noopener noreferrer" aria-label="Ludogic en YouTube"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="5.5" width="19" height="13" rx="4"/><path d="M10.2 9.3v5.4l4.6-2.7z" class="fill"/></svg></a>
    </nav>
    <p id="footer-text"></p>
    <p class="footer-legal">
      <a href="/es/aviso-legal.html">Aviso Legal</a> · <a href="/es/politica-de-privacidad.html">Política de Privacidad</a> · <a href="#" id="cookie-settings-link" data-home="/es/">Preferencias de cookies</a>
    </p>
  </footer>

  <!-- Banner de cookies: oculto hasta que cookie-consent.js decide si
       mostrarlo (según haya o no una decisión previa guardada). -->
  <div class="cookie-banner" id="cookie-banner" hidden>
    <p class="cookie-banner-text">
      <span id="cookie-banner-message"></span>
      <a id="cookie-banner-link" href="/es/politica-de-privacidad.html"></a>
    </p>
    <div class="cookie-banner-actions">
      <button type="button" class="btn btn-outline" id="cookie-reject"></button>
      <button type="button" class="btn btn-primary" id="cookie-accept"></button>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" defer></script>
  <script src="/data.es.js" defer></script>
  <script src="/render.js" defer></script>
  <script src="/hero3d.js" defer></script>
  <script src="/building3d.js" defer></script>
  <script src="/ambient-particles.js" defer></script>
  <script src="/script.js" defer></script>
  <script src="/cookie-consent.js" defer></script>
</body>
</html>
